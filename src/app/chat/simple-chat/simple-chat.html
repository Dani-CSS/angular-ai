<mat-card class="chat-container">

  <div class="chat-header">
    <mat-toolbar class="chat-title">
      <span>Simple Chat</span>
    </mat-toolbar>
  </div>

  <div class="Chat-history" #chatHistory>
     <div class="messages">
      @for (message of messages(); track message) {
        <div class="message">
          <div class="message-buble" [ngClass]="{'user': !message.isBot}">
            {{ message.text }}
          </div>
        </div>
      }
     </div>
  </div>

  <div class="chat-input">
     <mat-form-field class="full-width" appearance="fill">
      <mat-label>Ask anything</mat-label>
      <input matInput [(ngModel)]="userInput" (keyup.enter)="sendMessage()">
      <button matSuffix mat-icon-button aria-label="Send" (click)="sendMessage()">
        <mat-icon>send</mat-icon>
      </button>
     </mat-form-field>

  </div>

</mat-card>
